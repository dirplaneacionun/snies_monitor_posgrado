name: SNIES Posgrado Report

# La ejecución semanal NO se programa aquí con `schedule`: GitHub retrasa o salta
# los cron cuando hay mucha carga. En su lugar, un job en cron-job.org llama a la
# API de GitHub (POST .../actions/workflows/snies_posgrado_daily.yml/dispatches)
# todos los jueves a las 8:00 a.m. hora Colombia, y eso dispara este workflow.
# También se puede correr a mano desde la pestaña Actions → "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-snies-posgrado:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Información de ejecución
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Runner:"
          hostname

          echo
          echo "Sistema:"
          uname -a

          echo
          echo "Hora UTC:"
          date -u

          echo
          echo "Hora Colombia:"
          TZ=America/Bogota date

          echo
          echo "Repositorio:"
          echo "$GITHUB_REPOSITORY"

          echo "========================================"

      # Instalación oficial de Google Chrome
      - name: Configurar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verificar Chrome
        run: |
          google-chrome --version

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline posgrado
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: |
          set -euo pipefail

          python scripts/run_snies_posgrado.py

      - name: Subir screenshots de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: tmp/*.png
          retention-days: 3

      - name: Commitear datos
        run: |
          set -euo pipefail

          git config user.name "snies-bot"
          git config user.email "snies-bot@uninorte.edu.co"

          git add data/ "Programas/"
          git diff --staged --quiet || git commit -m "snies-posgrado: $(date +'%Y-%m-%d')"

      - name: Generar dashboard
        run: |
          set -euo pipefail

          python docs/generar_dashboard.py

      - name: Commitear dashboard y publicar
        run: |
          set -euo pipefail

          git add docs/
          git diff --staged --quiet || git commit -m "dashboard: $(date +'%Y-%m-%d')"

          # Cambia "main" si tu rama principal tiene otro nombre.
          git push origin HEAD:main
